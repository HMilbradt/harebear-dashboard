title: Home
header:
  # icon: default (the harebear mark), none, si:<name>, di:<name> or an https URL
  icon: default
  showTitle: true
  # false: the icon is the only way to the first page; other pages are tabs
  homeInNav: true
theme:
  accent: "#2f5bd3"
  mode: system
search:
  engine: duckduckgo
  bangs:
    - shortcut: "!yt"
      title: YouTube
      url: https://www.youtube.com/results?search_query={q}
    - shortcut: "!gh"
      title: GitHub
      url: https://github.com/search?q={q}
