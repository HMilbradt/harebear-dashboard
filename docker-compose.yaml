# Example: the dashboard plus a read-only Docker API for the docker widget.
services:
  harebear-dashboard:
    image: ghcr.io/hmilbradt/harebear-dashboard:main
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount read only to freeze the dashboard; edits on the host apply live.
      - ./config:/config:ro
      # Optional: your own widget types, compiled on start and on every save.
      # - ./plugins:/plugins:ro
    environment:
      TZ: America/Vancouver
      # Secrets are referenced from YAML as env:NAME.
      # SPEEDTEST_TRACKER_API_TOKEN: ...

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
